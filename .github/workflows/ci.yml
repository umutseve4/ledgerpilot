name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Sıfır bağımlılık: package.json yok, npm install adımı bilinçli olarak yok.
      - name: Smoke test (store + billing, DOM'suz)
        run: node test/smoke.js
